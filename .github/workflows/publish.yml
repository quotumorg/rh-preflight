name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish, for example v0.5.13
        required: true

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install build
          python -m build
      - name: check version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(python -c 'import rh_preflight; print(rh_preflight.__version__)')"
          test "v$version" = "$TAG"
          test "$(python -c 'import json; print(json.load(open("server.json"))["version"])')" = "$version"
          grep -q "mcp-name: io.github.quotumorg/rh-preflight" README.md
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: wait for the pypi release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent --output /dev/null "https://pypi.org/pypi/rh-preflight-mcp/${TAG#v}/json" && exit 0
            sleep 10
          done
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
