name: rh-preflight
version: 0.5.4
requires_hermes: ">=0.23.0"
description: "rh-preflight by quotum with HEY Research Lab. Reads builder records and ten Robinhood Chain projects; rh-preflight applies your approval rules before Hermes acts on chain 4663."
author: quotum, HEY Research Lab
license: MIT
provides_tools:
  - builder_card
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - post_approval_response
config_schema:
  mode:
    type: str
    default: ask_when
    description: ask, ask_when or note
  quiet_days:
    type: int
    default: 30
    description: Ask after this many measured days without a meaningful ship
  ask_quiet:
    type: bool
    default: true
    description: Enable the no meaningful ship rule
  ask_unmeasured:
    type: bool
    default: true
    description: Ask when activity is not measured
  ask_no_record:
    type: bool
    default: true
    description: Ask when HEY has no record
  ask_not_verified:
    type: bool
    default: false
    description: Ask when HEY does not record a Verified Builder badge
  allow_unattended:
    type: bool
    default: false
    description: Permit detected cron calls in ask modes without a human request; non-cron asks use Hermes approval
  assume_chain:
    type: int
    description: Optional 4663 for tools without an explicit chain field
  tool_patterns:
    type: list
    default:
      - swap|buy|sell|trade|approve|permit|transfer|pay|mint|bridge|deposit|stake|deploy|x402|liquidity|add_lp|remove_lp
    description: Case-insensitive regular expressions matched against tool names
  tx_check:
    type: str
    default: "on"
    description: on or off; Toll transaction simulation, local signature checks stay enabled
  toll_key_header:
    type: str
    default: x-api-key
    description: Optional Toll environment-key header; the default awaits provider confirmation
  ask_payout_other:
    type: bool
    default: true
    description: Ask when transaction proceeds go to another wallet
  ask_hookr_refused:
    type: bool
    default: true
    description: Ask when Hookr says this pool's rules refuse the sending wallet
  toll_coin_findings:
    type: str
    default: silent
    description: line or silent; neutral coin finding attribution, without classifications
  on_unchecked:
    type: str
    default: ask
    description: ask, stop or note when an applicable check cannot complete
  tx_timeout:
    type: float
    default: 15.0
    description: Toll and Hookr transaction budget in seconds, at most 25; runs alongside builder reads
  timeout:
    type: float
    default: 4.0
    description: Builder and independent-source budget in seconds, capped at 25 below the Hermes 30-second limit; restart after changing
  hey_cache_seconds:
    type: float
    default: 600
    description: HEY record cache seconds, maximum 86400; 0 disables; invalid values use 600; restart after changing
  sources:
    type: dict
    default: {}
    description: Source names mapped to on or off; omitted entries are on
  ask_when:
    type: dict
    default: {}
    description: payee_no_priors_record defaults to true; vault_strategy_inactive defaults to false; stock_no_hey_record defaults to false (ask for no HEY record even when Toll confirms an official Robinhood Stock Token)
